services:
  postgres:
    image: postgres:16-alpine
    container_name: aiot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiot
      POSTGRES_PASSWORD: aiot123456
      POSTGRES_DB: aiot_elder
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiot -d aiot_elder"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aiot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8
    container_name: aiot-emqx
    restart: unless-stopped
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: aiot123456
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqxdata:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 12

volumes:
  pgdata:
  redisdata:
  emqxdata:
